name: Testes Web Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-web:
    name: Selenium com Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      HEADLESS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Conferir o Chrome
        run: google-chrome --version

      - name: Executar os testes web
        run: python -m pytest

      - name: Disponibilizar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-web-python
          path: reports/
          if-no-files-found: warn
          retention-days: 14
